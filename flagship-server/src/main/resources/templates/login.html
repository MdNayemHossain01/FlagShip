<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — FlagShip Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0b1120;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 36px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #3b82f6;
            color: #f8fafc;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }
        .btn-primary {
            background-color: #3b82f6;
            border-color: #3b82f6;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
        }
        .demo-pill {
            cursor: pointer;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #94a3b8;
            transition: all 0.2s;
        }
        .demo-pill:hover {
            background: #334155;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <i class="bi bi-flag-fill text-primary" style="font-size: 2.5rem;"></i>
        <h3 class="fw-bold mt-2">Flag<span class="text-primary">Ship</span></h3>
        <p class="text-secondary small">Feature-Flag & Gradual-Rollout Platform</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
        <i class="bi bi-exclamation-circle-fill me-1"></i> Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="alert alert-info py-2 small" role="alert">
        You have been signed out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label text-secondary small fw-semibold">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                <input type="text" id="usernameInput" name="username" class="form-control" placeholder="admin" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-secondary small fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
                <input type="password" id="passwordInput" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">Sign In to Dashboard</button>
    </form>

    <div class="border-top border-secondary pt-3 mt-2">
        <small class="text-secondary d-block mb-2 text-center">Click a demo account to prefill:</small>
        <div class="d-flex flex-wrap gap-2 justify-content-center">
            <span class="demo-pill" onclick="fillCreds('admin', 'admin123')">
                <strong class="text-danger">ADMIN:</strong> admin
            </span>
            <span class="demo-pill" onclick="fillCreds('approver', 'approver123')">
                <strong class="text-purple" style="color: #a78bfa;">APPROVER:</strong> approver
            </span>
            <span class="demo-pill" onclick="fillCreds('editor', 'editor123')">
                <strong class="text-primary">EDITOR:</strong> editor
            </span>
            <span class="demo-pill" onclick="fillCreds('viewer', 'viewer123')">
                <strong class="text-secondary">VIEWER:</strong> viewer
            </span>
        </div>
    </div>
</div>

<script>
    function fillCreds(u, p) {
        document.getElementById('usernameInput').value = u;
        document.getElementById('passwordInput').value = p;
    }
</script>
</body>
</html>
