<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — FlagShip Platform'">FlagShip Feature-Flag Platform</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-base: #0b1120;
            --bg-surface: #1e293b;
            --bg-surface-hover: #334155;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --accent-amber: #f59e0b;
        }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
        }
        .sidebar {
            background-color: #0f172a;
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
            width: 260px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .main-content {
            margin-left: 260px;
            padding: 24px 32px;
        }
        .nav-link {
            color: var(--text-muted);
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 4px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }
        .nav-link:hover, .nav-link.active {
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }
        .nav-link i {
            font-size: 1.15rem;
        }
        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
        }
        .card-header {
            background-color: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }
        .table {
            color: var(--text-main);
            border-color: var(--border-color);
        }
        .table th {
            background-color: rgba(15, 23, 42, 0.7);
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }
        .table td {
            background-color: var(--bg-surface);
            border-color: var(--border-color);
            vertical-align: middle;
        }
        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            border-color: var(--accent-blue);
            color: var(--text-main);
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }
        .badge-env-prod { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
        .badge-env-stg  { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
        .badge-env-dev  { background-color: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .badge-role-admin { background-color: #ef4444; color: #fff; }
        .badge-role-approver { background-color: #8b5cf6; color: #fff; }
        .badge-role-editor { background-color: #3b82f6; color: #fff; }
        .badge-role-viewer { background-color: #64748b; color: #fff; }
        .kill-switch-btn {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            border: none;
            color: white;
            font-weight: 600;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
            transition: transform 0.1s ease;
        }
        .kill-switch-btn:hover {
            transform: scale(1.02);
            color: white;
        }
        .btn-primary {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }
        .btn-primary:hover {
            background-color: #2563eb;
            border-color: #2563eb;
        }
    </style>
</head>
<body>

<div th:fragment="sidebar(activeMenu)">
    <div class="sidebar d-flex flex-column p-3">
        <div class="d-flex align-items-center gap-2 mb-4 px-2">
            <i class="bi bi-flag-fill text-primary fs-3"></i>
            <div>
                <h5 class="m-0 fw-bold tracking-tight">Flag<span class="text-primary">Ship</span></h5>
                <small class="text-secondary" style="font-size: 0.75rem;">Gradual-Rollout Engine</small>
            </div>
        </div>

        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}"
                   th:href="@{/(project=${currentProject}, env=${currentEnv})}">
                    <i class="bi bi-grid-1x2-fill"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'flags' ? 'active' : ''}"
                   th:href="@{/flags(project=${currentProject}, env=${currentEnv})}">
                    <i class="bi bi-toggles2"></i> Feature Flags
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'approvals' ? 'active' : ''}"
                   th:href="@{/approvals(project=${currentProject}, env=${currentEnv})}">
                    <i class="bi bi-shield-check"></i> Approvals
                    <span th:if="${pendingApprovalsCount > 0}" class="badge bg-warning text-dark ms-auto"
                          th:text="${pendingApprovalsCount}"></span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'audit' ? 'active' : ''}"
                   th:href="@{/audit(project=${currentProject}, env=${currentEnv})}">
                    <i class="bi bi-clock-history"></i> Audit & Rollback
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'experiments' ? 'active' : ''}"
                   th:href="@{/experiments(project=${currentProject}, env=${currentEnv})}">
                    <i class="bi bi-bar-chart-fill"></i> Experiments & SRM
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'hygiene' ? 'active' : ''}"
                   th:href="@{/hygiene(project=${currentProject}, env=${currentEnv})}">
                    <i class="bi bi-recycle"></i> Flag Hygiene
                    <span th:if="${staleFlagsCount > 0}" class="badge bg-danger ms-auto"
                          th:text="${staleFlagsCount}"></span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'playground' ? 'active' : ''}"
                   th:href="@{/playground(project=${currentProject}, env=${currentEnv})}">
                    <i class="bi bi-terminal-fill"></i> Rule Playground
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'users' ? 'active' : ''}"
                   th:href="@{/users(project=${currentProject}, env=${currentEnv})}">
                    <i class="bi bi-people-fill"></i> Users & Roles
                </a>
            </li>
        </ul>

        <div class="mt-auto pt-3 border-top border-secondary">
            <div class="d-flex align-items-center justify-content-between px-2 mb-2">
                <small class="text-secondary"><i class="bi bi-broadcast text-success me-1"></i> SDK Stream</small>
                <span class="badge bg-dark border border-secondary text-info" th:text="${activeSdkClients} + ' clients'">0 clients</span>
            </div>
            <div class="d-flex align-items-center justify-content-between px-2">
                <div>
                    <span class="fw-semibold d-block text-truncate" style="max-width: 140px;" th:text="${currentUser}">admin</span>
                    <span class="badge" th:classappend="'badge-role-' + ${#strings.toLowerCase(currentRole)}" th:text="${currentRole}">ADMIN</span>
                </div>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-secondary" title="Logout">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:fragment="navbar">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
        <div class="d-flex align-items-center gap-3">
            <!-- Project selector -->
            <div class="input-group input-group-sm" style="width: 220px;">
                <span class="input-group-text bg-dark text-secondary border-secondary"><i class="bi bi-folder2"></i></span>
                <select class="form-select bg-dark text-white border-secondary"
                        onchange="location.href='?project=' + this.value + '&env=' + '[[${currentEnv}]]'">
                    <option th:each="p : ${projects}" th:value="${p.key}" th:text="${p.name}"
                            th:selected="${p.key == currentProject}"></option>
                </select>
            </div>

            <!-- Environment selector tabs -->
            <div class="btn-group btn-group-sm" role="group">
                <a th:each="e : ${environments}"
                   th:href="'?project=' + ${currentProject} + '&env=' + ${e.key}"
                   class="btn"
                   th:classappend="${e.key == currentEnv} ? 'btn-primary' : 'btn-outline-secondary'"
                   th:text="${e.name}">Production</a>
            </div>
        </div>

        <div class="d-flex align-items-center gap-2">
            <span class="badge"
                  th:classappend="${currentEnv == 'production' ? 'badge-env-prod' : (currentEnv == 'staging' ? 'badge-env-stg' : 'badge-env-dev')}">
                <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>
                <span th:text="${#strings.toUpperCase(currentEnv)}">PRODUCTION</span>
            </span>
            <span class="badge bg-secondary"><i class="bi bi-cpu"></i> Java 21 / Spring Boot 3</span>
        </div>
    </div>

    <!-- Alert notifications -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${warningMessage}" class="alert alert-warning alert-dismissible fade show text-dark" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${warningMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-x-circle-fill me-2"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</div>
</body>
</html>
